[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsc-gene-set-study"
version = "0.1.0"
description = "Nested cross-validation of gene-set size for cell-line drug response"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
gene-study = "gene_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
